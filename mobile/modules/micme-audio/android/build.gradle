plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.heisdanito.micme'
version = '1.0.0'

android {
  namespace "expo.modules.micmeaudio"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "com.squareup.okhttp3:okhttp:4.9.2"
}
